<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord énergétique du Canada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
</head>
<body>
    <div id="app" class="container-fluid">
        <!-- Header -->
        <div class="header">
            <h1>⚡ Tableau de bord énergétique du Canada</h1>
            <p>Production, demande et échanges en temps réel</p>
            <div class="header-actions">
                <button class="header-btn" id="themeToggle" title="Basculer le thème"></button>
                <button class="header-btn" id="debugToggle" title="Afficher/Masquer le débogage"></button>
            </div>
        </div>

        <!-- Debug box -->
        <div class="debug collapsed" id="debugBox">
            <div id="debugContent"></div>
            <button class="debug-toggle" id="debugToggleBtn">▼</button>
        </div>

        <!-- Main content -->
        <div id="mainContent"></div>
    </div>

    <!-- Scripts: Bundled and minified -->
    <script src="js/utils/dom-helpers.js"></script>
    <script src="js/utils/formatters.js"></script>
    <script src="js/utils/storage-utils.js"></script>
    <script src="js/state.js"></script>
    <script src="js/api.js"></script>
    <script src="js/chart-manager.js"></script>
    <script src="js/components/demand-tab.js"></script>
    <script src="js/components/production-tab.js"></script>
    <script src="js/components/nuclear-tab.js"></script>
    <script src="js/components/ontario-tab.js"></script>
    <script src="js/components/exchange-tab.js"></script>
    <script src="js/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
