name: Update Turbined Flow and Reservoir Levels

# La demande, la production et les échanges sont archivés par
# update-hydro-quebec.yml dans data/hq/, toutes les 30 minutes. Ce workflow ne
# couvre que les deux séries qu'il laisse de côté : les débits turbinés par
# centrale et les niveaux de réservoirs.
#
# Leur fenêtre source est de 7 jours, donc une exécution quotidienne suffirait
# en théorie. En pratique GitHub abandonne l'essentiel des exécutions
# planifiées — mesuré le 2026-09-25 : 6 sur 48 attendues pour les crons de 30
# minutes, avec des trous jusqu'à 5 h 47. Une planification quotidienne
# risquerait donc de sauter plusieurs jours d'affilée. Quatre tentatives par
# jour ramènent l'espérance à au moins une exécution quotidienne, et chaque
# passage rattrape les journées manquées puisqu'il relit toute la fenêtre.
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
    inputs:
      domaines:
        description: 'Domaines à collecter (vide = tous)'
        required: false
        default: ''

concurrency:
  group: collecte-donnees
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Collecter
        run: python3 scripts/collect_quebec.py ${{ github.event.inputs.domaines }}

      - name: Commiter si les données ont changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quebec/
          if git diff --staged --quiet; then
            echo "Rien de neuf."
            exit 0
          fi
          git commit -m "data: débits turbinés et niveaux $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Le collecteur IESO pousse sur la même branche toutes les 2 h.
          for essai in 1 2 3; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "Push refusé (essai $essai), nouvelle tentative."
            sleep 5
          done
          exit 1
